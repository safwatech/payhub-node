name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install
      - name: Stage shared test vectors at the path tests expect
        run: |
          # Tests reference __dirname/../../shared/test-vectors/...
          # On the mirror, the vectors live in vendor/shared/test-vectors/
          # — stage a sibling 'shared/' so both monorepo and mirror runs
          # resolve the same path.
          mkdir -p ../shared
          cp -R vendor/shared/test-vectors ../shared/
      - run: npm run build
      - run: npm test
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
